<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main class="container py-5">
        <h1>Request a tutoring session</h1>
            
        <form class="request-form" action="process-request.php" method="post"> 
        <div class="row g-3 form-label">
            <div class="col-12 col-md-7">
                <label for="course">Course</label>
                <input id="course" name="course" required>
            </div>
            <div class="col-12 col-md-5">
                <label for="date">Preferred date</label>
                <input id="date" name="date" type="date" required>
            </div>
        </div>
    
			<button class="btn btn-danger" type="submit">Request session</button>
        </form>
    </main>
</body>

</html>
